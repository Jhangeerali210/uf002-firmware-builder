name: Build UF002 Custom Boot Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          gcc-arm-linux-gnueabihf \
          binutils-arm-linux-gnueabihf \
          make bc libssl-dev flex bison \
          device-tree-compiler \
          python3 git wget curl \
          busybox-static \
          mkbootimg || true
        if ! command -v mkbootimg &>/dev/null; then
          pip3 install mkbootimg 2>/dev/null || true
        fi

    - name: Clone MSM8909 kernel
      run: |
        git clone --depth=1 \
          https://github.com/msm8916-mainline/linux.git \
          kernel/
        head -5 kernel/Makefile

    - name: Install UF002 DTS
      run: |
        DTS_DIR=""
        for d in kernel/arch/arm/boot/dts/qcom kernel/arch/arm/boot/dts kernel/arch/arm64/boot/dts/qcom; do
          if [ -d "$d" ]; then DTS_DIR="$d"; break; fi
        done
        if [ -z "$DTS_DIR" ]; then
          echo "ERROR: DTS dir not found"
          find kernel/arch -name "*.dts" | head -5
          exit 1
        fi
        echo "DTS dir: $DTS_DIR"
        cp dts/msm8909-uf002-mb-v02.dts "$DTS_DIR/"
        MAKEFILE="$DTS_DIR/Makefile"
        if [ -f "$MAKEFILE" ] && ! grep -q "uf002" "$MAKEFILE"; then
          echo 'dtb-$(CONFIG_ARCH_QCOM) += msm8909-uf002-mb-v02.dtb' >> "$MAKEFILE"
          echo "Added to Makefile"
        fi

    - name: Configure kernel
      working-directory: kernel
      env:
        ARCH: arm
        CROSS_COMPILE: arm-linux-gnueabihf-
      run: |
        make qcom_defconfig 2>/dev/null || \
        make msm8909_defconfig 2>/dev/null || \
        make multi_v7_defconfig
        ./scripts/config \
          --enable CONFIG_USB_GADGET \
          --enable CONFIG_USB_CONFIGFS \
          --enable CONFIG_USB_CONFIGFS_RNDIS \
          --enable CONFIG_USB_CONFIGFS_NCM \
          --enable CONFIG_USB_CONFIGFS_ACM \
          --enable CONFIG_USB_CHIPIDEA \
          --enable CONFIG_USB_CHIPIDEA_UDC \
          --enable CONFIG_USB_CHIPIDEA_HOST \
          --enable CONFIG_USB_ETH \
          --enable CONFIG_USB_ETH_RNDIS \
          --enable CONFIG_REGULATOR_PM8916 \
          --enable CONFIG_MFD_SPMI_PMIC \
          --enable CONFIG_SPMI \
          --enable CONFIG_SERIAL_MSM \
          --enable CONFIG_SERIAL_MSM_CONSOLE \
          --enable CONFIG_CFG80211 \
          --enable CONFIG_MAC80211 \
          --enable CONFIG_THERMAL \
          --enable CONFIG_CPUFREQ_DT
        make olddefconfig

    - name: Compile kernel and DTB
      working-directory: kernel
      env:
        ARCH: arm
        CROSS_COMPILE: arm-linux-gnueabihf-
      run: |
        make -j$(nproc) zImage dtbs 2>&1 | tee ../build.log
        ls -lh arch/arm/boot/zImage 2>/dev/null && echo "zImage OK" || echo "zImage MISSING"
        find arch/arm/boot/dts -name "*uf002*" 2>/dev/null && echo "DTB OK" || echo "DTB MISSING"

    - name: Build boot.img
      run: |
        ZIMAGE="kernel/arch/arm/boot/zImage"
        DTB=$(find kernel/arch/arm/boot/dts -name "*uf002*.dtb" 2>/dev/null | head -1)
        if [ ! -f "$ZIMAGE" ]; then echo "ERROR: zImage missing"; exit 1; fi
        mkdir -p output
        if [ -n "$DTB" ]; then
          cat "$ZIMAGE" "$DTB" > output/kernel_with_dtb.img
          echo "Appended DTB: $DTB"
        else
          cp "$ZIMAGE" output/kernel_with_dtb.img
          echo "No DTB, plain zImage"
        fi
        mkdir -p tmp_rd/proc tmp_rd/sys tmp_rd/dev tmp_rd/mnt tmp_rd/bin
        printf '#!/bin/sh\nmount -t proc proc /proc\nmount -t sysfs sys /sys\nmount -t devtmpfs dev /dev 2>/dev/null || mdev -s\necho "UF002 booting..."\nexec /bin/sh\n' > tmp_rd/init
        chmod +x tmp_rd/init
        cp /bin/busybox tmp_rd/bin/ 2>/dev/null || true
        (cd tmp_rd && find . | cpio -H newc -o | gzip > ../output/ramdisk.cpio.gz)
        if command -v mkbootimg &>/dev/null; then
          mkbootimg \
            --kernel output/kernel_with_dtb.img \
            --ramdisk output/ramdisk.cpio.gz \
            --base 0x80000000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --pagesize 2048 \
            --cmdline "console=ttyMSM0,115200n8 rw" \
            -o output/uf002-custom-boot.img
          echo "boot.img done"
        else
          cp output/kernel_with_dtb.img output/uf002-kernel-dtb.img
        fi
        ls -lh output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: uf002-custom-boot-${{ github.run_number }}
        path: |
          output/
          build.log
        retention-days: 30

    - name: Upload build log on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
        retention-days: 7
